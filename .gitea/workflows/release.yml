name: Release

# Optional source tags must match the package versions at that commit.
# Full quality checks run locally with ROS Jazzy before an authorized release.
on:
  push:
    tags: ["v*"]

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same script the local release flow runs, so there is one set of
      # gates rather than one here and another on a developer machine. Only the
      # tag-consistency gates run here; the rest need the ROS toolchain and
      # already ran locally before the tag was pushed.
      - name: The tag must match every version this commit declares
        run: python scripts/release.py verify-tag --tag "${{ github.ref_name }}"
