# Windows PCAN-FD hardware only. This 80 MHz recipe is an example; verify adapter clock and bus timing.
backends:
- pcan
channels:
- pcan:PCAN_USBBUS1
pcan:
  channels:
  - PCAN_USBBUS1
  bitrate: 1000000
  data_bitrate: 5000000
  probe_protocols:
  - can_fd
  fd_timing:
    f_clock: 80000000
    nom_brp: 1
    nom_tseg1: 63
    nom_tseg2: 16
    nom_sjw: 16
    data_brp: 1
    data_tseg1: 11
    data_tseg2: 4
    data_sjw: 4
